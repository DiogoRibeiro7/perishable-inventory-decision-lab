substitutions:
  _REGION: europe-west1
  _REPOSITORY: ml-images
  _IMAGE: perishable-inventory-decision-lab
  _SERVICE_ACCOUNT: perishable-lab-runner

steps:
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        pip install poetry==1.8.3
        poetry install --no-interaction
        poetry run pytest
        poetry run ruff check .
        poetry run mypy src

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - perishable-lab-daily-decisions
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --tasks=1
      - --max-retries=2
      - --task-timeout=3600s
      - --service-account=${_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-env-vars=IMAGE_TAG=${SHORT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
