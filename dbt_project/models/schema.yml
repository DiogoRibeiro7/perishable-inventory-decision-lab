version: 2

models:
  - name: stg_daily_demand
    description: Validated store-product-day demand and unit economics.
    columns:
      - name: date
        tests: [not_null]
      - name: store_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: demand
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date, store_id, product_id]

  - name: fct_daily_order_decisions
    description: Versioned forecast distributions and order recommendations.
    columns:
      - name: decision_date
        tests: [not_null]
      - name: recommended_order_quantity
        tests: [not_null]

  - name: fct_feature_set_daily
    description: Point-in-time daily feature set with explicit availability and processing timestamps.
    columns:
      - name: business_date
        tests: [not_null]
      - name: store_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: feature_set_version
        tests: [not_null]
      - name: availability_time
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [business_date, store_id, product_id, feature_set_version]

  - name: fct_dashboard_daily
    description: Store-product-day semantic layer for operational dashboards.
    columns:
      - name: business_date
        tests: [not_null]
      - name: store_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: recommended_order_quantity
        tests: [not_null]
      - name: recommendation_count
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [business_date, store_id, product_id]

  - name: stg_product_identity_mappings
    description: Validated slowly changing product-identity mappings.
    columns:
      - name: raw_item_id
        tests: [not_null]
      - name: demand_entity_id
        tests: [not_null]
      - name: known_at
        tests: [not_null]

  - name: dim_product_identity
    description: Accepted, rejected, and review-pending product identity history for as-of lookup.
    columns:
      - name: raw_item_id
        tests: [not_null]
      - name: canonical_product_id
        tests: [not_null]
      - name: demand_entity_id
        tests: [not_null]
