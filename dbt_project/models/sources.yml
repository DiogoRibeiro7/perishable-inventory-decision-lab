version: 2

sources:
  - name: raw_retail
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: raw_retail
    tables:
      - name: daily_sales
        columns:
          - name: source_primary_key
            tests: [not_null, unique]
          - name: business_date
            tests: [not_null]
          - name: store_id
            tests: [not_null]
          - name: source_product_id
            tests: [not_null]
      - name: inventory_snapshots
      - name: waste_events
      - name: product_master
        columns:
          - name: source_product_id
            tests: [not_null]
          - name: product_id
            tests: [not_null]
          - name: shelf_life_days
            tests: [not_null]
      - name: product_identity_mappings
        columns:
          - name: raw_item_id
            tests: [not_null]
          - name: demand_entity_id
            tests: [not_null]
          - name: known_at
            tests: [not_null]
      - name: promotions
      - name: scoring_outputs
