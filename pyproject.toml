[tool.poetry]
name = "perishable-inventory-decision-lab"
version = "0.1.0"
description = "Probabilistic forecasting and perishable inventory decision system"
authors = ["Diogo"]
readme = "README.md"
packages = [{ include = "perishable_lab", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26,<2.3"
pandas = ">=2.1,<3.0"
scikit-learn = ">=1.4,<2.0"
pydantic = ">=2.7,<3.0"
pyyaml = ">=6.0,<7.0"
typer = {version = ">=0.12,<1.0", extras = ["all"]}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<7.0"
ruff = ">=0.5,<1.0"
mypy = ">=1.10,<2.0"
pandas-stubs = ">=2.2,<3.0"
types-pyyaml = ">=6.0,<7.0"
pre-commit = ">=3.7,<5.0"

[tool.poetry.scripts]
perishable-lab = "perishable_lab.cli:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
packages = ["perishable_lab"]

[tool.pytest.ini_options]
addopts = "-q --cov=perishable_lab --cov-report=term-missing"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
