[tool.poetry]
name = "perishable-inventory-decision-lab"
version = "0.1.0"
description = "Probabilistic forecasting and perishable inventory decision system"
authors = ["Diogo"]
readme = "README.md"
license = "Apache-2.0"
packages = [
    { include = "perishable_lab", from = "src" },
    { include = "case_study" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26,<2.5"
pandas = ">=2.1,<4.0"
scikit-learn = ">=1.4,<2.0"
pydantic = ">=2.7,<3.0"
pyyaml = ">=6.0,<7.0"
typer = {version = ">=0.12,<1.0", extras = ["all"]}

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0"
pytest-cov = ">=5.0,<8.0"
ruff = ">=0.5,<1.0"
mypy = ">=1.10,<3.0"
pandas-stubs = ">=2.2,<4.0"
types-pyyaml = ">=6.0,<7.0"
pre-commit = ">=3.7,<5.0"

[tool.poetry.scripts]
perishable-lab = "perishable_lab.cli:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
packages = ["perishable_lab"]

[tool.pytest.ini_options]
addopts = "-q --cov=perishable_lab --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "extended: slower assurance checks such as local benchmarks and larger fixtures",
]

[tool.mutmut]
paths_to_mutate = [
    "src/perishable_lab/inventory/simulator.py",
    "src/perishable_lab/inventory/policies.py",
    "src/perishable_lab/decision.py",
    "src/perishable_lab/feature_store.py",
    "src/perishable_lab/publication.py",
]
runner = "poetry run pytest tests/test_inventory.py tests/test_decision.py tests/test_feature_store.py tests/test_publication.py tests/test_properties.py"
tests_dir = "tests"

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
