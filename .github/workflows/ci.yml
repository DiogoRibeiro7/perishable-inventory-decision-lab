name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Lint
        run: poetry run ruff check .
      - name: Type-check
        run: poetry run mypy src
      - name: Repository hygiene
        run: poetry run python scripts/repo_hygiene.py
      - name: Fast tests
        run: poetry run pytest -m "not extended"
      - name: Extended tests
        run: poetry run pytest -m extended
      - name: Small benchmark
        run: poetry run perishable-lab benchmark --workload small --output-dir artifacts/benchmark-ci --fail-on-budget

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t perishable-lab:${{ github.sha }} .
